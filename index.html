<script>
  function showFatalError(title, detail) {
    var el = document.getElementById("fatal-error");
    el.style.display = "block";
    el.innerHTML = "<h2>" + title + "</h2>" + (detail || "");
  }
  window.addEventListener("error", function (e) {
    showFatalError("Erro ao carregar", (e.message || "erro desconhecido") + "\n\n" + (e.filename ? e.filename + ":" + e.lineno : ""));
  });
  window.addEventListener("unhandledrejection", function (e) {
    showFatalError("Erro (promise)", String((e.reason && e.reason.message) || e.reason));
  });

  window.storage = {
    async get(key, shared) {
      const v = localStorage.getItem(key);
      if (v == null) throw new Error("not found");
      return { key, value: v, shared: !!shared };
    },
    async set(key, value, shared) {
      localStorage.setItem(key, value);
      return { key, value, shared: !!shared };
    },
    async delete(key, shared) {
      localStorage.removeItem(key);
      return { key, deleted: true, shared: !!shared };
    },
    async list(prefix, shared) {
      const keys = Object.keys(localStorage).filter((k) => !prefix || k.startsWith(prefix));
      return { keys, prefix, shared: !!shared };
    },
  };
</script>
